name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (needed for Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build the web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor (copies web build + plugins into the native project)
        run: npx cap sync android

      - name: Make sure the AdMob App ID is in the manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            APPID=$(node -e "console.log(require('./capacitor.config.json').plugins.AdMob.appId)")
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APPID\"/>\n    </application>#" "$MANIFEST"
          fi

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banking-empire-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
